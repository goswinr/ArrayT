name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call: # releaseNuget.yml runs this before publishing

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # tests use Scriptorium, the same test suite runs on .NET and on JS via Fable

      - name: Run tests .NET
        run: dotnet run --configuration Release --no-build
        working-directory: ./Tests

      # run JS tests (Fable compiles the tests to JS and runs them with node, then verifies TS compilation):

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Clean Install npm dependencies
        run: npm ci
        working-directory: ./Tests

      - name: Run tests JS
        run: npm test
        working-directory: ./Tests
