name: Docs

# copied and adapted from https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Ship-it

# Trigger this Action when new code is pushed to the main branch
on:
  push:
    branches:
      - main

permissions:
  contents: read

# Make sure only one documentation build/deploy runs at a time.
# New pushes to main cancel any in-progress run to avoid concurrent deployments.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build code to make xml file
        # see required xml tags: https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Generating-API-documentation
        # the CopyReadmeToDocs target in ArrayT.fsproj also copies README.md to Docs/index.md
        run: dotnet build -c Release

      - name: Generate the documentation html
        # for this to work in dotnet-tools.json, rollForward must be set to 'false' for fsdocs-tool
        run: dotnet fsdocs build --properties Configuration=Release --input Docs --output DocsGenerated

      - name: Upload documentation html files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./DocsGenerated

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # permissions needed to publish to GitHub Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5